<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- The <title> and the render-app marker (which scripts/render.ts looks for) are added by
     vite.config.ts from src/project-config.ts. The heading, the canvas aspect ratio and the export
     size are set by src/main.ts from the same file (the size of the format chosen by ?format=).
     Nothing here names the film. scripts/build-single.ts turns this page into one file. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- An empty icon: without it the browser asks for /favicon.ico and logs a 404 on every load. -->
<link rel="icon" href="data:," />
<style>
  :root { color-scheme: dark; --line: #2a2630; --dim: #9a93a3; --fg: #f3ebdd; --signal: #ff2e74; }
  html, body { margin: 0; height: 100%; background: #0a090d; color: var(--fg); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  #page { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 1fr auto; }
  #wrap { grid-column: 1; grid-row: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #c { max-width: 100%; max-height: 100%; aspect-ratio: var(--out-aspect, 9 / 16); background: #000; cursor: pointer; border-radius: 10px; }
  #side { grid-column: 2; grid-row: 1 / span 2; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #side header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #side h1 { margin: 0 0 2px; font-size: 15px; }
  #count { color: var(--dim); }
  #shots { overflow-y: auto; padding: 6px 0 16px; }
  .group { padding: 14px 16px 4px; color: var(--dim); font: 600 11px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
  .shot { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; padding: 5px 16px; cursor: pointer; align-items: baseline; }
  .shot:hover { background: #ffffff0d; }
  .shot.on { background: #ff2e7426; box-shadow: inset 3px 0 0 var(--signal); }
  .shot .t { color: var(--dim); font: 11px ui-monospace, Menlo, monospace; }
  .shot .s { color: #6fd6a8; font-size: 11px; }
  .shot.card .s { color: var(--dim); }
  #ui { grid-column: 1; grid-row: 2; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  #row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  button { font: inherit; color: var(--fg); background: #1d1924; border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; min-width: 72px; }
  button:hover { border-color: var(--dim); }
  #play { background: var(--signal); border-color: var(--signal); color: #100e14; font-weight: 700; }
  #now { font-weight: 600; }
  #info { margin-left: auto; color: var(--dim); font: 12px ui-monospace, Menlo, monospace; white-space: nowrap; }
  #scrub { width: 100%; margin: 0; accent-color: var(--signal); }
  #keys { color: var(--dim); font-size: 11px; margin-top: 6px; }
  #errs { display: none; position: fixed; top: 8px; left: 8px; right: 8px; max-height: 40vh; overflow: auto; background: #300; color: #fbb; padding: 8px; white-space: pre-wrap; z-index: 9; }
  @media (max-width: 760px) { #page { grid-template-columns: 1fr; } #side { display: none; } }
  body.export #page { display: block; }
  body.export #ui, body.export #side, body.export #errs { display: none !important; }
  body.export #wrap { position: absolute; inset: 0; padding: 0; align-items: flex-start; justify-content: flex-start; }
  body.export #c { width: var(--out-w); height: var(--out-h); max-width: none; max-height: none; border-radius: 0; }
</style>
</head>
<body>
<div id="page">
  <div id="wrap"><canvas id="c"></canvas></div>
  <aside id="side">
    <header><h1 id="film-title"></h1><div id="count"></div></header>
    <div id="shots"></div>
  </aside>
  <div id="ui">
    <div id="row"><button id="play">Play</button><button id="music">Music</button><button id="format">Format</button><span id="now"></span><span id="info"></span></div>
    <input id="scrub" type="range" min="0" value="0" />
    <div id="keys">Space or click: play, pause · [ ]: shot before, next shot · arrows: 1 s (shift: 5 s) · , .: one frame · L: loop the shot · M: next music · F: next format</div>
  </div>
</div>
<pre id="errs"></pre>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
